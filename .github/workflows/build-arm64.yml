name: Arduino IDE (ARM64)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/build-arm64.yml'
      - '.vscode/**'
      - 'docs/**'
      - 'scripts/**'
      - '!scripts/merge-channel-files.js'
      - 'static/**'
      - '*.md'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

# A newly triggered run cancels the in-progress run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # See vars.GO_VERSION field of https://github.com/arduino/arduino-cli/blob/master/DistTasks.yml
  GO_VERSION: '1.26'
  # See: https://github.com/actions/setup-node/#readme
  NODE_VERSION: '22'
  YARN_VERSION: '1.22'
  # Skip downloading the Chromium binary used by Puppeteer (not needed for the build).
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  JOB_TRANSFER_ARTIFACT_PREFIX: build-artifacts-

jobs:
  build-type-determination:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.determination.outputs.is-release }}
      is-nightly: ${{ steps.determination.outputs.is-nightly }}
      channel-name: ${{ steps.determination.outputs.channel-name }}
    permissions: {}
    steps:
      - name: Determine the type of build
        id: determination
        run: |
          if [[
            "${{ startsWith(github.ref, 'refs/tags/') }}" == "true"
          ]]; then
            is_release="true"
            is_nightly="false"
            channel_name="stable"
          elif [[
            "${{ github.event_name }}" == "workflow_dispatch" &&
            "${{ github.ref }}" == "refs/heads/main"
          ]]; then
            is_release="false"
            is_nightly="true"
            channel_name="nightly"
          else
            is_release="false"
            is_nightly="false"
            channel_name="nightly"
          fi

          echo "is-release=$is_release" >> $GITHUB_OUTPUT
          echo "is-nightly=$is_nightly" >> $GITHUB_OUTPUT
          echo "channel-name=$channel_name" >> $GITHUB_OUTPUT

  build:
    name: build (Linux ARM64)
    needs: build-type-determination
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    env:
      # Location of artifacts generated by build. The `postpackage` script collects
      # the distributable files here when running on CI.
      BUILD_ARTIFACTS_PATH: electron-app/dist/build-artifacts

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            fakeroot \
            rpm

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install Yarn
        run: npm install --global "yarn@${{ env.YARN_VERSION }}"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.x'

      - name: Install setuptools
        # Python >= 3.12 removed `distutils` from the standard library, but the
        # node-gyp@9 vendored by electron-rebuild still imports it. Installing
        # setuptools restores a `distutils` shim (same reason local builds work).
        run: python -m pip install --upgrade setuptools

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.x

      # ---------------------------------------------------------------------------
      # 16 KiB page-size kernels (Asahi Linux, some Apple Silicon setups)
      # ---------------------------------------------------------------------------
      # Two distinct fixes are required to run on 16 KiB-page-size kernels:
      #   1. Build-time (below): Electron 35's V8 headers require C++20, but
      #      node-gyp forces `-std=c++17`, breaking the native-module rebuild.
      #      We append `-std=gnu++20` via a g++ wrapper.
      #   2. Run-time: V8's pooled pages assume 4 KiB pages and SEGV on 16 KiB
      #      kernels. This is worked around automatically at launch by passing
      #      `--js-flags="--nodecommit_pooled_pages"` from the app's main process
      #      (see electron-app/arduino-ide-electron-main.js). It is applied only
      #      when the runtime page size > 4 KiB, so 4 KiB arm64 systems are
      #      unaffected. Ref: https://issues.chromium.org/issues/378017037
      # ---------------------------------------------------------------------------

      - name: Force C++20 for native module rebuild
        # Electron 35's V8 headers require C++20, but node-gyp forces `-std=c++17`
        # which breaks the rebuild of the native modules (drivelist, node-pty,
        # keytar, native-keymap). Append `-std=gnu++20` last via a compiler wrapper.
        run: |
          sudo tee /usr/local/bin/g++-cxx20 >/dev/null <<'EOF'
          #!/bin/bash
          exec "$(command -v g++)" "$@" -std=gnu++20
          EOF
          sudo chmod +x /usr/local/bin/g++-cxx20
          echo "CXX=/usr/local/bin/g++-cxx20" >> "$GITHUB_ENV"

      - name: Package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_NIGHTLY: ${{ needs.build-type-determination.outputs.is-nightly }}
          IS_RELEASE: ${{ needs.build-type-determination.outputs.is-release }}
        run: |
          npx node-gyp install
          yarn install

          yarn --cwd arduino-ide-extension build
          yarn --cwd electron-app rebuild
          yarn --cwd electron-app build
          yarn --cwd electron-app package

      - name: Stage publishable artifacts (AppImage + zip only)
        env:
          STAGE_DIR: electron-app/dist/arm64-publish
        run: |
          mkdir -p "$STAGE_DIR"
          shopt -s nullglob
          cp ${{ env.BUILD_ARTIFACTS_PATH }}/*.AppImage "$STAGE_DIR/" || true
          cp ${{ env.BUILD_ARTIFACTS_PATH }}/*.zip "$STAGE_DIR/" || true
          shopt -u nullglob
          ls -la "$STAGE_DIR"

      - name: Upload builds to job transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JOB_TRANSFER_ARTIFACT_PREFIX }}Linux_arm64
          if-no-files-found: error
          path: electron-app/dist/arm64-publish

  changelog:
    needs: build-type-determination
    runs-on: ubuntu-latest
    outputs:
      BODY: ${{ steps.changelog.outputs.BODY }}
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # To fetch all history for all branches and tags.

      - name: Generate Changelog
        id: changelog
        env:
          IS_RELEASE: ${{ needs.build-type-determination.outputs.is-release }}
        run: |
          export LATEST_TAG=$(git describe --abbrev=0)
          export GIT_LOG=$(git log --pretty=" - %s [%h]" $LATEST_TAG..HEAD | sed 's/ *$//g')
          if [ "$IS_RELEASE" = true ]; then
            export BODY=$(echo -e "$GIT_LOG")
          else
            export LATEST_TAG_WITH_LINK=$(echo "[$LATEST_TAG](https://github.com/arduino/arduino-ide/releases/tag/$LATEST_TAG)")
            if [ -z "$GIT_LOG" ]; then
                export BODY="There were no changes since version $LATEST_TAG_WITH_LINK."
            else
                export BODY=$(echo -e "Changes since version $LATEST_TAG_WITH_LINK:\n$GIT_LOG")
            fi
          fi

          # Set workflow step output
          # See: https://docs.github.com/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          DELIMITER="$RANDOM"
          echo "BODY<<$DELIMITER" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "$DELIMITER" >> $GITHUB_OUTPUT

  release:
    # Attaches the ARM64 builds to the GitHub Release created for the tag by
    # `build.yml`. `overwrite` makes it update the release instead of failing
    # when both workflows race to create it.
    needs:
      - build-type-determination
      - build
      - changelog
    if: >
      always() &&
      needs.build-type-determination.outputs.is-release == 'true' &&
      needs.build.result == 'success' &&
      needs.changelog.result == 'success'
    runs-on: ubuntu-latest

    env:
      ARTIFACTS_FOLDER: build-artifacts

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.JOB_TRANSFER_ARTIFACT_PREFIX }}Linux_arm64
          path: ${{ env.ARTIFACTS_FOLDER }}

      - name: Get Tag
        id: tag_name
        run: |
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Publish Release [GitHub]
        uses: svenstaro/upload-release-action@2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ steps.tag_name.outputs.TAG_NAME }}
          file: ${{ env.ARTIFACTS_FOLDER }}/*
          tag: ${{ github.ref }}
          file_glob: true
          body: ${{ needs.changelog.outputs.BODY }}
          overwrite: true

  clean:
    # This job must run after all jobs that use the transfer artifact.
    needs:
      - build
      - release
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Remove unneeded job transfer artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: ${{ env.JOB_TRANSFER_ARTIFACT_PREFIX }}Linux_arm64
